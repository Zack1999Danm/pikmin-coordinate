<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b45">
<title>CoCo 門市座標資料庫</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#20252b;background:#f3f6f4}
*{box-sizing:border-box}body{margin:0;max-width:1200px;padding:16px;margin-inline:auto}
header{padding:12px 2px 16px}h1{margin:0 0 5px;font-size:26px}.muted{color:#66736b;font-size:13px}
.panel,.card{background:#fff;border:1px solid #dfe8e2;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #102b1a08}
.toolbar{display:grid;grid-template-columns:1fr 190px 160px;gap:9px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd8d0;border-radius:10px;font:inherit;background:white}
textarea{min-height:115px;resize:vertical}button{border:0;border-radius:10px;padding:10px 13px;background:#176b45;color:white;font:inherit;font-weight:650;cursor:pointer}
button.alt{background:#edf5ef;color:#175b3b;border:1px solid #d2e3d7}button.danger{background:#a83232}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.stats{font-size:13px;color:#647168;margin-top:10px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.9fr);gap:12px;align-items:start}
#map{height:620px;border-radius:12px;border:1px solid #dfe8e2;z-index:1}
.list{max-height:620px;overflow:auto;padding-right:3px}.card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.store-name{font-weight:750;margin-bottom:5px}.coord{font:13px ui-monospace,Consolas,monospace;color:#3d4941;overflow-wrap:anywhere}
.card-actions{display:flex;flex-direction:column;gap:7px;min-width:100px}.card-actions button{font-size:13px;padding:9px}
.maplink{font-size:13px;color:#176b45;text-align:center;text-decoration:none;padding:4px}
.hidden{display:none!important}.notice{padding:11px;border-radius:10px;background:#fff8e5;color:#75531b;font-size:13px}
.formgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}.adminbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
h2{font-size:17px;margin:0 0 10px}.empty{text-align:center;color:#748078;padding:25px}
footer{font-size:12px;color:#77827a;padding:12px 2px}.pill{display:inline-block;background:#edf5ef;color:#175b3b;border-radius:20px;padding:3px 8px;font-size:12px;margin-top:4px}
@media(max-width:850px){.layout{grid-template-columns:1fr}#map{height:380px}.list{max-height:none}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}
@media(max-width:620px){body{padding:10px}.toolbar,.formgrid{grid-template-columns:1fr}.card{grid-template-columns:1fr}.card-actions{flex-direction:row}.card-actions button{flex:1}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header><h1>🥤 CoCo 門市座標資料庫</h1><div class="muted">全台門市查詢・座標複製・地圖檢視・管理員批次匯入</div></header>
<section class="panel">
 <div class="toolbar">
  <input id="search" type="search" placeholder="搜尋門市名稱、地址或座標">
  <select id="county"><option value="">全部縣市</option></select>
  <select id="sort"><option value="north">由北到南</option><option value="name">依門市名稱</option></select>
 </div>
 <div class="actions"><button id="copyAll">複製目前顯示座標</button><button class="alt" id="copyNames">複製門市＋座標</button><button class="alt" id="refresh">重新整理</button></div>
 <div class="stats" id="stats">正在載入資料…</div><div id="status" class="muted"></div>
</section>
<section class="panel">
 <div class="adminbar"><div><h2>管理員</h2><div class="muted" id="adminState">一般訪客：可查詢及複製</div></div><button class="alt" id="loginToggle">管理員登入</button></div>
 <div id="loginPanel" class="hidden" style="margin-top:12px"><div class="formgrid"><input id="email" type="email" placeholder="管理員 Email"><input id="password" type="password" placeholder="管理員密碼"><button id="login">登入</button></div><div class="muted" style="margin-top:7px">管理員帳號需先在 Supabase 建立並加入 site_admins；網站不開放公開註冊。</div></div>
 <div id="editor" class="hidden" style="margin-top:14px">
  <h2>新增／修改門市</h2><div class="formgrid"><input id="storeName" placeholder="門市名稱"><input id="latitude" inputmode="decimal" placeholder="緯度"><input id="longitude" inputmode="decimal" placeholder="經度"></div>
  <div class="actions"><button id="saveStore">新增門市</button><button class="alt hidden" id="cancelEdit">取消修改</button><button class="alt" id="logout">登出</button></div>
  <hr style="border:0;border-top:1px solid #e5ece7;margin:16px 0">
  <h2>批次匯入門市</h2><div class="muted">每行一筆，格式：門市名稱,緯度,經度。可貼上 CSV 或以 Tab 分隔的資料。匯入前會檢查重複。</div>
  <textarea id="bulkInput" placeholder="台北○○店,25.000000,121.000000&#10;桃園○○店,24.000000,121.000000"></textarea>
  <div class="actions"><button class="alt" id="previewImport">檢查重複／預覽</button><button id="doImport" disabled>確認匯入</button></div><div id="importPreview" class="muted"></div>
 </div>
</section>
<div class="layout"><section class="panel list" id="list"><div class="empty">載入中…</div></section><section class="panel"><h2>門市地圖</h2><div id="map"></div><div class="muted" style="margin-top:8px">地圖圖資由 OpenStreetMap 提供；點選標記可查看門市名稱及座標。</div></section></div>
<footer>座標格式：緯度, 經度。公開訪客僅能讀取；新增、修改、刪除及批次匯入僅限授權管理員。請以官方門市資訊核對營業狀態。</footer>
<script>
const $=id=>document.getElementById(id);
const counties=["基隆市","臺北市","新北市","桃園市","新竹市","新竹縣","苗栗縣","臺中市","彰化縣","南投縣","雲林縣","嘉義市","嘉義縣","臺南市","高雄市","屏東縣","宜蘭縣","花蓮縣","臺東縣","澎湖縣","金門縣","連江縣"];
counties.forEach(c=>{let o=document.createElement("option");o.value=c;o.textContent=c;$("county").append(o)});
const countyAliases={"台北":"臺北市","臺北":"臺北市","新北":"新北市","桃園":"桃園市","基隆":"基隆市","新竹市":"新竹市","新竹縣":"新竹縣","苗栗":"苗栗縣","台中":"臺中市","臺中":"臺中市","彰化":"彰化縣","南投":"南投縣","雲林":"雲林縣","嘉義市":"嘉義市","嘉義縣":"嘉義縣","台南":"臺南市","臺南":"臺南市","高雄":"高雄市","屏東":"屏東縣","宜蘭":"宜蘭縣","花蓮":"花蓮縣","台東":"臺東縣","臺東":"臺東縣","澎湖":"澎湖縣","金門":"金門縣","連江":"連江縣","馬祖":"連江縣"};
function countyOf(s){if(s.county)return s.county;let n=(s.name||"")+" "+(s.address||"");for(const [k,v] of Object.entries(countyAliases))if(n.includes(k))return v;return "未分類"}
let db=null,stores=[],session=null,editingId=null,pendingImport=[],map=null,markers=null;
const configured=window.SUPABASE_URL&&window.SUPABASE_ANON_KEY&&!window.SUPABASE_URL.includes("PASTE_")&&!window.SUPABASE_ANON_KEY.includes("PASTE_");
if(configured&&window.supabase)db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
function coord(s){return `${Number(s.latitude).toFixed(6)}, ${Number(s.longitude).toFixed(6)}`}
function filtered(){let q=$("search").value.trim().toLowerCase(),c=$("county").value,rows=stores.filter(s=>(!c||countyOf(s)===c)&&(!q||[s.name,s.address||"",coord(s)].join(" ").toLowerCase().includes(q)));if($("sort").value==="name")rows.sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant"));else rows.sort((a,b)=>b.latitude-a.latitude);return rows}
async function copyText(t,btn){try{await navigator.clipboard.writeText(t);let old=btn.textContent;btn.textContent="已複製 ✓";setTimeout(()=>btn.textContent=old,1100)}catch(e){prompt("請手動複製：",t)}}
function initMap(){if(!window.L)return;map=L.map("map").setView([23.7,120.9],7);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);markers=L.featureGroup().addTo(map)}
function render(){let rows=filtered();$("stats").textContent=`目前顯示 ${rows.length} / ${stores.length} 間門市`;let root=$("list");root.innerHTML="";
 if(!rows.length)root.innerHTML='<div class="empty">沒有符合條件的門市</div>';
 rows.forEach(s=>{let card=document.createElement("article");card.className="card";let info=document.createElement("div"),name=document.createElement("div"),c=document.createElement("div"),r=document.createElement("div");name.className="store-name";name.textContent=s.name;c.className="coord";c.textContent=coord(s);r.className="muted";r.textContent=(s.address?s.address+" · ":"")+countyOf(s);info.append(name,c,r);
 let acts=document.createElement("div");acts.className="card-actions";let cp=document.createElement("button");cp.textContent="複製座標";cp.onclick=()=>copyText(coord(s),cp);let a=document.createElement("a");a.className="maplink";a.target="_blank";a.rel="noopener";a.href=`https://www.google.com/maps?q=${s.latitude},${s.longitude}`;a.textContent="Google 地圖 ↗";acts.append(cp,a);
 if(session){let e=document.createElement("button");e.className="alt";e.textContent="修改";e.onclick=()=>startEdit(s);let d=document.createElement("button");d.className="danger";d.textContent="刪除";d.onclick=()=>deleteStore(s);acts.append(e,d)}card.append(info,acts);root.append(card)});
 if(markers){markers.clearLayers();rows.forEach(s=>{if(Number.isFinite(+s.latitude)&&Number.isFinite(+s.longitude))L.marker([s.latitude,s.longitude]).bindPopup(`<b>${escapeHtml(s.name)}</b><br>${coord(s)}`).addTo(markers)});if(rows.length){let b=markers.getBounds();if(b.isValid())map.fitBounds(b,{padding:[18,18],maxZoom:13})}}
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function loadStores(){if(!db){$("status").innerHTML='<div class="notice">尚未設定 Supabase，請先確認 config.js。</div>';return}$("status").textContent="同步雲端資料中…";let {data,error}=await db.from("stores").select("*").order("latitude",{ascending:false}).order("name");if(error){$("status").textContent="讀取失敗："+error.message;return}stores=data||[];$("status").textContent="資料已同步";render()}
function setAdminUI(){$("adminState").textContent=session?"已登入管理員：可新增、修改、刪除及批次匯入":"一般訪客：可查詢及複製";$("loginToggle").classList.toggle("hidden",!!session);$("loginPanel").classList.add("hidden");$("editor").classList.toggle("hidden",!session);render()}
async function checkSession(){if(!db)return;let {data}=await db.auth.getSession();session=data.session;setAdminUI()}
function startEdit(s){editingId=s.id;$("storeName").value=s.name;$("latitude").value=s.latitude;$("longitude").value=s.longitude;$("saveStore").textContent="儲存修改";$("cancelEdit").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
$("cancelEdit").onclick=()=>{editingId=null;$("storeName").value=$("latitude").value=$("longitude").value="";$("saveStore").textContent="新增門市";$("cancelEdit").classList.add("hidden")};
$("saveStore").onclick=async()=>{let name=$("storeName").value.trim(),latitude=Number($("latitude").value),longitude=Number($("longitude").value);if(!name||!$("latitude").value||!$("longitude").value||!Number.isFinite(latitude)||!Number.isFinite(longitude)||latitude < 21||latitude>26||longitude<118||longitude>123)return alert("請輸入台灣範圍內正確的店名與座標");let payload={name,latitude,longitude,updated_at:new Date().toISOString()};let res=editingId?await db.from("stores").update(payload).eq("id",editingId):await db.from("stores").insert(payload);if(res.error)return alert("儲存失敗："+res.error.message);$("cancelEdit").click();await loadStores();alert("已儲存")};
async function deleteStore(s){if(!confirm(`確定刪除「${s.name}」？`))return;let {error}=await db.from("stores").delete().eq("id",s.id);if(error)return alert("刪除失敗："+error.message);await loadStores()}
function parseBulk(){let lines=$("bulkInput").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),out=[],bad=[];lines.forEach((line,i)=>{let p=line.split(/[,\t;]/).map(x=>x.trim());if(p.length<3){bad.push(i+1);return}let latitude=Number(p[p.length-2]),longitude=Number(p[p.length-1]),name=p.slice(0,-2).join(" ");if(!name||!Number.isFinite(latitude)||!Number.isFinite(longitude)||latitude<21||latitude>26||longitude<118||longitude>123){bad.push(i+1);return}out.push({name,latitude,longitude})});return {out,bad}}
function near(a,b){let dy=(a.latitude-b.latitude)*111320,dx=(a.longitude-b.longitude)*101000;return Math.hypot(dx,dy)}
$("previewImport").onclick=()=>{let {out,bad}=parseBulk(),dups=[],fresh=[];out.forEach(x=>{let hit=stores.find(s=>s.name.trim().toLowerCase()===x.name.trim().toLowerCase());if(!hit)hit=stores.find(s=>near(s,x)<=20);if(hit)dups.push({incoming:x,existing:hit,meters:Math.round(near(hit,x))});else fresh.push(x)});pendingImport=fresh;$("doImport").disabled=!fresh.length;$("importPreview").textContent=`解析 ${out.length} 筆；格式錯誤 ${bad.length} 行；疑似重複 ${dups.length} 筆；可新增 ${fresh.length} 筆。重複項目不會匯入。`+(dups.length?" 疑似重複："+dups.slice(0,8).map(d=>`${d.incoming.name} ↔ ${d.existing.name}（約${d.meters}公尺）`).join("；"):"")+(bad.length?" 錯誤行："+bad.join(","):"")};
$("doImport").onclick=async()=>{if(!pendingImport.length)return;if(!confirm(`確認新增 ${pendingImport.length} 筆門市？`))return;let {error}=await db.from("stores").insert(pendingImport);if(error)return alert("匯入失敗："+error.message);pendingImport=[];$("doImport").disabled=true;$("importPreview").textContent="匯入完成";await loadStores();alert("批次匯入完成")};
$("search").oninput=render;$("county").onchange=render;$("sort").onchange=render;$("refresh").onclick=loadStores;
$("copyAll").onclick=e=>{let r=filtered();if(r.length)copyText(r.map(coord).join("\n"),e.currentTarget)};
$("copyNames").onclick=e=>{let r=filtered();if(r.length)copyText(r.map(s=>`${s.name},${coord(s)}`).join("\n"),e.currentTarget)};
$("loginToggle").onclick=()=>$("loginPanel").classList.toggle("hidden");
$("login").onclick=async()=>{if(!db)return alert("資料庫尚未設定");let {data,error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)return alert("登入失敗："+error.message);session=data.session;setAdminUI()};
$("logout").onclick=async()=>{await db.auth.signOut();session=null;editingId=null;setAdminUI()};
initMap();
if(db){checkSession();loadStores();db.auth.onAuthStateChange((_e,s)=>{session=s;setAdminUI()});db.channel("stores-live").on("postgres_changes",{event:"*",schema:"public",table:"stores"},loadStores).subscribe()}else{$("status").innerHTML='<div class="notice">尚未填入有效的 Supabase 設定。</div>'}
</script></body></html>
